<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f1e9">
  <title>去远方 — 好奇心的地图集</title>
  <meta name="description" content="每一个问题，都有想去的远方。探索孩子们的好奇心、研究与发现。">
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
  <header>
    <button class="brand" id="home" aria-label="去远方 / Dream Journey"><span>去远方</span><small>DREAM JOURNEY</small></button>

  <main id="app"></main>

    <button class="close" aria-label="关闭作品查看器">×</button><div id="viewer-content"></div>
