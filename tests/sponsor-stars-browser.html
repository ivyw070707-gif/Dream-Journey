<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>星星布袋 · 隔离预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#536042;background:#e8e8db;font:13px/1.6 system-ui,sans-serif}.preview-toolbar{position:sticky;top:0;z-index:3;padding:12px 18px;border-bottom:1px solid #c6cdb7;background:#f8f5ed}.preview-toolbar strong{font-size:15px}.preview-toolbar p{margin:3px 0 9px;color:#7b856b}.preview-controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button{border:1px solid #b8c4a7;border-radius:5px;padding:6px 11px;background:#faf8ef;color:#536042;font:inherit;cursor:pointer}button:hover{background:#e7ecd9}button:disabled{opacity:.5;cursor:wait}.preview-stage{overflow:auto;padding:14px}iframe{display:block;width:1440px;height:900px;border:1px solid #b9c1a7;background:#f5f1e7}#results{max-height:160px;overflow:auto;white-space:pre-wrap;margin:10px 18px;color:#5d7050;font:12px/1.6 ui-monospace,monospace}#results.fail{color:#a24934}
  </style>
</head>
<body>
  <div class="preview-toolbar">
    <strong>星星布袋 · 隔离测试预览</strong>
    <p>使用实际首页与样式，donor 身份仅在此预览中模拟。不会创建账户、修改真实登录状态或提交付款。</p>
    <div class="preview-controls">
      <button type="button" data-size="desktop">桌面 1440</button>
      <button type="button" data-size="mobile">手机 390</button>
      <button type="button" data-amount="1" disabled>1 万</button>
      <button type="button" data-amount="14" disabled>14 万</button>
      <button type="button" data-amount="50" disabled>50 万</button>
      <button type="button" data-amount="100" disabled>100 万</button>
      <button type="button" id="run" disabled>运行检查</button>
      <button type="button" id="reset">重置预览</button>
    </div>
  </div>
  <pre id="results" role="status">正在载入真实首页…</pre>
  <div class="preview-stage"><iframe title="Donor 星星布袋隔离预览" sandbox="allow-scripts allow-same-origin"></iframe></div>
  <script type="module" src="sponsor-stars-browser.js"></script>
</body>
</html>
